name: mr-carson

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args:
        APP: api
    command: ["node", "apps/api/dist/main.js"]
    environment:
      API_PORT: 3000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral-small}
      OLLAMA_OCR_MODEL: ${OLLAMA_OCR_MODEL:-glm-ocr}
      DUCKDB_PATH: /data/db/mr-carson.duckdb
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-GBP}
    ports:
      - "3000:3000"
    volumes:
      - duckdb_data:/data/db
      - uploads:/data/uploads
    depends_on:
      ollama:
        condition: service_healthy

  bot:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args:
        APP: telegram-bot
    command: ["node", "apps/telegram-bot/dist/main.js"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      API_URL: http://api:3000
      UPLOADS_DIR: /data/uploads
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-GBP}
    volumes:
      - uploads:/data/uploads
    depends_on:
      - api

volumes:
  ollama_models:
  uploads:
  duckdb_data:
